name: OSS security inventory and patches

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build and verify the current security candidate
        type: boolean
        default: true
  push:
    paths: ['Dockerfile', '.dockerignore', 'Cargo.lock', 'package-lock.json', 'requirements*.txt', '.github/workflows/oss-security.yml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'Cargo.lock', 'package-lock.json', 'requirements*.txt', '.github/workflows/oss-security.yml']

permissions:
  contents: read

jobs:
  security:
    uses: IPA-CyberLab/IPA-RS-HeteroNetwork/.github/workflows/oss-security-reusable.yml@55a3636a4bca2e3c0fb9f1281c62436ff722c10c
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      tooling_ref: 55a3636a4bca2e3c0fb9f1281c62436ff722c10c
      auto_patch: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      build_candidate: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_candidate) }}
