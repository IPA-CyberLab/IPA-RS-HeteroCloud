name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: heterocloud
          POSTGRES_PASSWORD: heterocloud-test-password
          POSTGRES_DB: heterocloud_test_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heterocloud -d heterocloud_test_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release identity and artifact contract
        run: |
          python3 -m unittest discover -s scripts/tests -p test_release_artifact.py -v
          python3 scripts/release_artifact.py validate
      - name: Refuse an already published channel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 -c 'import json,os; from pathlib import Path; assets=json.loads((Path(os.environ["RUNNER_TEMP"])/"release-assets.json").read_text())["assets"]; assert not any(a["name"] == "heterocloud-release-artifact.json" for a in assets), "channel artifact already published"'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://heterocloud:heterocloud-test-password@127.0.0.1:5432/heterocloud_test_release
        run: |
          HETEROCLOUD_TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            cargo test --locked -p heterocloud-api --test registration
          HETEROCLOUD_FLOW_CREDENTIAL_TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            cargo test --locked -p heterocloud-api --test flow_developer_credentials
          HETEROCLOUD_STORE_TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            cargo test --locked -p heterocloud-store --test reconcile
          HETEROCLOUD_STORE_TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            cargo test --locked -p heterocloud-store --test flow_credentials
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - working-directory: apps/console
        run: npm ci
      - working-directory: apps/console
        run: npm test -- --run
      - working-directory: apps/console
        run: npm run build

      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/heterocloud
      - run: helm template heterocloud deploy/helm/heterocloud >/tmp/heterocloud.yaml

  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release identity
        id: release
        run: python3 scripts/release_artifact.py validate >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.heterocloud.cargo-version=${{ steps.release.outputs.cargo_version }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
      - name: Export pushed digest and attach channel artifact
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_artifact.py generate > "$RUNNER_TEMP/heterocloud-release-artifact.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/heterocloud-release-artifact.json"

  cli:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release identity
        shell: bash
        run: python scripts/release_artifact.py validate

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p heterocloud-cli

      - name: Exercise CLI command contracts
        if: runner.os == 'Linux'
        run: >-
          python3 scripts/tests/cli_audit.py
          --binary target/release/heterocloud
          --report /tmp/heterocloud-cli-audit.json

      - name: Upload Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          asset="heterocloud-${RELEASE_TAG}-${os}-${arch}.tar.gz"
          tar -C target/release -czf "$asset" heterocloud
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"${asset}.sha256"
          else
            shasum -a 256 "$asset" >"${asset}.sha256"
          fi
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256"

      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $asset = "heterocloud-$env:RELEASE_TAG-windows-$arch.zip"
          Compress-Archive -Path target/release/heterocloud.exe -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256"
