name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - working-directory: apps/console
        run: npm ci
      - working-directory: apps/console
        run: npm test -- --run
      - working-directory: apps/console
        run: npm run build

      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/heterocloud
      - run: helm template heterocloud deploy/helm/heterocloud >/tmp/heterocloud.yaml

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ipa-rs-heterocloud
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  cli:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked -p heterocloud-cli

      - name: Upload Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          os=$(printf '%s' "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          asset="heterocloud-${RELEASE_TAG}-${os}-${arch}.tar.gz"
          tar -C target/release -czf "$asset" heterocloud
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" >"${asset}.sha256"
          else
            shasum -a 256 "$asset" >"${asset}.sha256"
          fi
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber

      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $asset = "heterocloud-$env:RELEASE_TAG-windows-$arch.zip"
          Compress-Archive -Path target/release/heterocloud.exe -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
          gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --clobber
