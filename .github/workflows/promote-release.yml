name: Promote verified release image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without v
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: stable-image-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify stable release, exact commit, all assets and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          version=os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',version), 'stable version required'
          tag='v'+version
          release=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isDraft,isPrerelease,assets']))
          assert not release['isDraft'] and not release['isPrerelease'], 'published stable release required'
          names={x['name'] for x in release['assets']}
          for system in ['linux','macos','windows']:
            for arch in ['x64','arm64']:
              name=f'heterocloud-{tag}-{system}-{arch}.'+('zip' if system=='windows' else 'tar.gz')
              assert name in names and name+'.sha256' in names, 'all native CLI assets required'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-promotion';root.mkdir()
          subprocess.run(['gh','release','download',tag,'--pattern','heterocloud-release-artifact.json','--dir',str(root)],check=True)
          artifact=json.loads((root/'heterocloud-release-artifact.json').read_text())
          commit=subprocess.check_output(['git','rev-parse',f'refs/tags/{tag}^{{commit}}'],text=True).strip()
          assert artifact['component']=='heterocloud' and artifact['version']==version and artifact['commit']==commit
          repository='ghcr.io/'+os.environ['GITHUB_REPOSITORY'].lower()
          assert re.fullmatch(re.escape(repository)+r'@sha256:[0-9a-f]{64}',artifact['image']), 'repository image required'
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs?event=release&head_sha={commit}&per_page=100']))['workflow_runs']
          assert any(x['path']=='.github/workflows/release.yml' and x['head_sha']==commit and x['status']=='completed' and x['conclusion']=='success' for x in runs), 'successful complete release CI required'
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('VERIFIED_IMAGE='+artifact['image']+'\nIMAGE_REPOSITORY='+repository+'\n')
          print('Verified exact release and all six native CLI distributions')
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the verified image digest
        run: >-
          docker buildx imagetools create --prefer-index=false
          --tag "$IMAGE_REPOSITORY:latest" "$VERIFIED_IMAGE"
