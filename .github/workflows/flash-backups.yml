name: Flash backup and restore checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['crates/**', 'migrations/**', 'apps/console/**', 'contracts/api/v1/flash.openapi.json', '.github/workflows/flash-backups.yml']
  push:
    branches: [master]
    paths: ['crates/**', 'migrations/**', 'apps/console/**', 'contracts/api/v1/flash.openapi.json', '.github/workflows/flash-backups.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heterocloud
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: heterocloud_test_backups
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U heterocloud -d heterocloud_test_backups" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p heterocloud-api --lib
      - run: cargo test --locked -p heterocloud-api --test flash_backups
        env:
          HETEROCLOUD_TEST_DATABASE_URL: postgres://heterocloud:test-only@127.0.0.1:5432/heterocloud_test_backups
      - run: cargo test --locked -p heterocloud-store --test flash_backups
        env:
          HETEROCLOUD_STORE_TEST_DATABASE_URL: postgres://heterocloud:test-only@127.0.0.1:5432/heterocloud_test_backups
      - run: cargo clippy --locked -p heterocloud-api -p heterocloud-cli --all-targets -- -D warnings
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=1 src/features/flash/flash-backups-panel.test.tsx src/features/flash/flash-service-detail-page.test.tsx src/components/layout/navigation.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/flash-backups.spec.ts --workers=1
