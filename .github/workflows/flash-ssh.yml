name: Flash SSH
on:
  push:
    branches: [master]
    paths:
      - 'crates/heterocloud-api/**'
      - 'crates/heterocloud-cli/**'
      - 'crates/heterocloud-domain/**'
      - 'crates/heterocloud-store/**'
      - 'crates/heterocloud-worker/**'
      - 'deploy/helm/heterocloud/**'
      - 'apps/console/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/flash-ssh.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: heterocloud
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: heterocloud_test_ssh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U heterocloud -d heterocloud_test_ssh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --locked -p heterocloud-cli --bin heterocloud
      - name: Test real OpenSSH over TCP and the CLI WebSocket tunnel
        env:
          HETEROCLOUD_TEST_DATABASE_URL: postgres://heterocloud:test-only@127.0.0.1:5432/heterocloud_test_ssh
          HETEROCLOUD_TEST_CLI: ${{ github.workspace }}/target/debug/heterocloud
        run: cargo test --locked -p heterocloud-api --test flash_ssh -- --nocapture
      - run: 'cargo test --locked -p heterocloud-api --lib ssh_routes::tests'
      - run: 'cargo test --locked -p heterocloud-cli --lib ssh::tests'
      - run: 'cargo test --locked -p heterocloud-worker --bin heterocloud-worker syouyu_provider_payload_excludes_management_metadata'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: apps/console
      - run: npm test -- --run src/features/flash/flash-ssh-panel.test.tsx
        working-directory: apps/console
