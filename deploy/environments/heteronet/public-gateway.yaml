- name: Reconcile the Secret Manager public gateway on every configured edge
  hosts: ichikawap1:uc-k8sp4
  gather_facts: false
  become: true
  vars:
    ansible_remote_tmp: /tmp/heterosecrets-ansible
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    gateway_ids:
      uc-k8sp1: a
      uc-k8sp2: b
      uc-k8s3p: c
      ichikawap1: d
      uc-k8sp4: e
    gateway_id: "{{ gateway_ids[inventory_hostname] }}"
    stage_dir: /run/heterosecrets-gateway-reconcile
  tasks:
    - name: Read the current public OpenBao CA certificate
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/workspace/.heteronetwork-iac/tunnel-kubeconfig
          - --namespace=openbao
          - get
          - secret
          - openbao-ca
          - --output=jsonpath={.data.tls\.crt}
      delegate_to: localhost
      become: false
      run_once: true
      register: openbao_ca_certificate
      changed_when: false
      no_log: true
    - name: Install the OpenBao CA for verified upstream TLS
      ansible.builtin.copy:
        content: "{{ openbao_ca_certificate.stdout | b64decode }}"
        dest: /etc/heteronetwork/openbao-ca.crt
        owner: root
        group: heteronetwork-gateway
        mode: '0640'
    - name: Create temporary root-only source directory
      ansible.builtin.file:
        path: "{{ stage_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage the reviewed gateway source
      ansible.builtin.copy:
        src: "public-gateway-{{ gateway_id }}.Caddyfile"
        dest: "{{ stage_dir }}/public-gateway-{{ gateway_id }}.Caddyfile"
        owner: root
        group: root
        mode: '0644'
    - name: Stage the idempotent reconciliation script
      ansible.builtin.copy:
        src: reconcile-public-gateway.sh
        dest: "{{ stage_dir }}/reconcile-public-gateway.sh"
        owner: root
        group: root
        mode: '0700'
    - name: Apply the gateway source and verify readiness
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ stage_dir }}/reconcile-public-gateway.sh"
          - "{{ gateway_id }}"
      register: gateway_result
      changed_when: "'Canonicalized' in gateway_result.stdout or 'ready' in gateway_result.stdout"
    - name: Remove temporary source directory
      ansible.builtin.file:
        path: "{{ stage_dir }}"
        state: absent
