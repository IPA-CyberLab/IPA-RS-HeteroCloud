replicaCount: 3
hostNetwork: true

publicOrigin: https://cloud-a.163-220-236-51.sslip.io
additionalOrigins:
  - https://cloud-b.163-220-236-52.sslip.io
  - https://cloud-c.163-220-236-53.sslip.io

flowAccess:
  issuer: heterocloud
  audience: heterocloud-flow-data

flowPublicEndpoints:
  - https://flow-a.163-220-236-51.sslip.io
  - https://flow-b.163-220-236-52.sslip.io
  - https://flow-c.163-220-236-53.sslip.io

secrets:
  flowAccessSecretName: heterocloud-flow-access
  flowAccessSecretKey: hmac-secret

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  pullPolicy: IfNotPresent

worker:
  replicaCount: 3
  flowEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/
  providerIssuer: heterocloud
  flowAudience: heterocloud-flow
  providerKeyId: heterocloud-provider-1

service:
  type: ClusterIP
  port: 8443

networkPolicy:
  enabled: true
  databaseCidrs:
    - 10.250.0.0/24
  databasePort: 25432
  providerCidrs:
    - 10.96.0.0/12
  providerPort: 8080

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
