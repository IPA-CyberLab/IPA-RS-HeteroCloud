replicaCount: 4
hostNetwork: true

publicOrigin: https://heterocloud.mizuame.app
additionalOrigins:
  - https://cloud-a.heterocloud.mizuame.app
  - https://cloud-b.heterocloud.mizuame.app
  - https://cloud-c.heterocloud.mizuame.app
trustedProxyNetworks:
  - 10.244.0.0/16

oidc:
  enabled: true
  issuerUrl: https://heterocloud.mizuame.app/id/realms/heterocloud
  backchannelIssuerUrl: http://console.heteronetwork.internal:18079/realms/heterocloud
  clientId: heterocloud-web
  publicCallbackUrl: https://heterocloud.mizuame.app/api/v1/auth/oidc/callback

ownerConsole:
  enabled: true
  replicaCount: 3
  origin: http://owner.heteronetwork.internal:21443
  oidcPublicCallbackUrl: http://owner.heteronetwork.internal:21443/api/v1/auth/oidc/callback
  email: fasutotesuto@gmail.com
  hostNetwork: false
  listenPort: 21443
  servicePort: 21443
  databaseProxy:
    enabled: true
    endpoint: postgres-ha-connector.kube-system.svc.cluster.local:25432
  allowedNetworks:
    - 10.250.0.0/24
  serviceProxyNetworks:
    - 10.244.0.0/16
  externalIPs:
    - 10.250.0.4
    - 10.250.0.5
    - 10.250.0.6
    - 10.250.0.8
    - 10.250.0.10

registry:
  enabled: true
  internalEndpoint: http://harbor-core.heterocloud-registry.svc.cluster.local/
  publicEndpoint: https://registry.heterocloud.mizuame.app
  adminUsername: admin
  adminSecretName: heterocloud-registry-admin
  adminPasswordKey: HARBOR_ADMIN_PASSWORD

flowAccess:
  issuer: heterocloud
  audience: heterocloud-flow-data

flowPublicEndpoints:
  - https://flow.heterocloud.mizuame.app
flowInternalEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/

syouyu:
  internalEndpoint: http://heterocloud-syouyu-api.heterocloud-syouyu.svc.cluster.local:8080/
  accessIssuer: heterocloud
  accessAudience: heterocloud-syouyu-data

secrets:
  flowAccessSecretName: heterocloud-flow-access
  flowAccessSecretKey: hmac-secret
  syouyuAccessSecretName: heterocloud-syouyu-access
  syouyuAccessSecretKey: hmac-secret

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  pullPolicy: IfNotPresent

worker:
  replicaCount: 4
  flowEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/
  flashEndpoint: http://heterocloud-flash-api.heterocloud-flash.svc.cluster.local:8080/
  syouyuEndpoint: http://heterocloud-syouyu-api.heterocloud-syouyu.svc.cluster.local:8080/
  providerIssuer: heterocloud
  flowAudience: heterocloud-flow
  flashAudience: heterocloud-flash
  providerKeyId: heterocloud-provider-1

service:
  type: ClusterIP
  port: 8443

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

networkPolicy:
  enabled: true
  databaseCidrs:
    - 10.250.0.0/24
  databasePort: 25432
  providerCidrs:
    - 10.96.0.0/12
  providerPort: 8080
  oidcCidrs:
    - 10.250.0.0/24
  oidcPort: 18079

nodeSelector:
  database.heteronetwork.io/proxy-ready: "true"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload.heteronetwork.io/capacity-tier
              operator: In
              values:
                - high
