replicaCount: 3
hostNetwork: true

publicOrigin: https://heterocloud.mizuame.app
additionalOrigins:
  - https://cloud-a.heterocloud.mizuame.app
  - https://cloud-b.heterocloud.mizuame.app
  - https://cloud-c.heterocloud.mizuame.app

oidc:
  enabled: true
  issuerUrl: https://heterocloud.mizuame.app/id/realms/heterocloud
  clientId: heterocloud-web
  publicCallbackUrl: https://heterocloud.mizuame.app/api/v1/auth/oidc/callback

flowAccess:
  issuer: heterocloud
  audience: heterocloud-flow-data

flowPublicEndpoints:
  - https://flow.heterocloud.mizuame.app
flowInternalEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/

secrets:
  flowAccessSecretName: heterocloud-flow-access
  flowAccessSecretKey: hmac-secret

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  pullPolicy: IfNotPresent

worker:
  replicaCount: 3
  flowEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/
  providerIssuer: heterocloud
  flowAudience: heterocloud-flow
  providerKeyId: heterocloud-provider-1

service:
  type: ClusterIP
  port: 8443

networkPolicy:
  enabled: true
  databaseCidrs:
    - 10.250.0.0/24
  databasePort: 25432
  providerCidrs:
    - 10.96.0.0/12
  providerPort: 8080

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
