replicaCount: 3
hostNetwork: true

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

publicOrigin: https://cloud.example.com
additionalOrigins: []
trustedProxyNetworks: []
secureCookie: true
sessionTtlSeconds: 43200
databaseMaxConnections: 20

oidc:
  enabled: false
  issuerUrl: ""
  backchannelIssuerUrl: ""
  clientId: ""
  publicCallbackUrl: ""

flowAccess:
  issuer: heterocloud
  audience: heterocloud-flow-data

flowPublicEndpoints:
  - https://flow.example.com
flowInternalEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/

flashExec:
  endpoint: http://heterocloud-flash-api.heterocloud-flash.svc.cluster.local:8080/
  providerIssuer: heterocloud
  audience: heterocloud-flash
  providerKeyId: heterocloud-provider-1

syouyu:
  internalEndpoint: http://heterocloud-syouyu-api.heterocloud-syouyu.svc.cluster.local:8080/
  accessIssuer: heterocloud
  accessAudience: heterocloud-syouyu-data

worker:
  replicaCount: 3
  flowEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/
  flashEndpoint: http://heterocloud-flash-api.heterocloud-flash.svc.cluster.local:8080/
  syouyuEndpoint: http://heterocloud-syouyu-api.heterocloud-syouyu.svc.cluster.local:8080/
  providerIssuer: heterocloud
  flowAudience: heterocloud-flow
  flashAudience: heterocloud-flash
  syouyuAudience: heterocloud-syouyu
  providerKeyId: heterocloud-provider-1
  pollMilliseconds: 500
  databaseMaxConnections: 5

secrets:
  runtimeSecretName: heterocloud-runtime
  databaseUrlKey: database-url
  csrfKeyKey: csrf-key
  bootstrapPasswordKey: bootstrap-password
  tlsSecretName: heterocloud-tls
  flowAccessSecretName: heterocloud-flow-access
  flowAccessSecretKey: hmac-secret
  syouyuAccessSecretName: heterocloud-syouyu-access
  syouyuAccessSecretKey: hmac-secret
  oidcSecretName: heterocloud-oidc
  oidcClientSecretKey: client-secret
  providerSigningSecretName: heterocloud-provider-signing
  providerSigningKeyKey: ed25519-private.pem

bootstrap:
  enabled: false
  email: ""
  displayName: HeteroCloud Administrator
  organizationSlug: heterocloud
  organizationName: HeteroCloud

ownerConsole:
  enabled: false
  replicaCount: 3
  origin: http://owner.heteronetwork.internal:21443
  oidcPublicCallbackUrl: http://owner.heteronetwork.internal:21443/api/v1/auth/oidc/callback
  email: ""
  hostNetwork: false
  listenPort: 21443
  servicePort: 21443
  databaseProxy:
    enabled: true
    endpoint: postgres-ha-connector.kube-system.svc.cluster.local:25432
    image: docker.io/library/haproxy:3.2.7-alpine@sha256:3b80483d47e1c7d1fc7eb4b9104f33d9a51259769be299eb675524dca2bc8157
  allowedNetworks:
    - 10.250.0.0/24
  # Source addresses used by the cluster service proxy after forwarding VPN traffic.
  serviceProxyNetworks: []
  externalIPs: []
  podDisruptionBudget:
    minAvailable: 2

registry:
  enabled: false
  internalEndpoint: http://harbor-core.heterocloud-registry.svc.cluster.local/
  publicEndpoint: https://registry.heterocloud.mizuame.app
  adminUsername: admin
  adminSecretName: heterocloud-registry-admin
  adminPasswordKey: HARBOR_ADMIN_PASSWORD

service:
  # The public HTTP entry point is the GitOps-managed Envoy Gateway. Keeping
  # this Service private removes the direct HeteroNetwork L4 bypass.
  type: ClusterIP
  port: 10443
  loadBalancerClass: ""
  trafficMode: forwarded
  ingressReplicas: 3
  externalTrafficPolicy: Cluster

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  databaseCidrs:
    - 10.250.0.0/24
  databasePort: 25432
  providerCidrs:
    - 10.96.0.0/12
  providerPort: 8080
  registryCidrs:
    - 10.96.0.0/12
  registryPort: 80
  oidcCidrs:
    - 0.0.0.0/0
    - ::/0
  oidcPort: 443

nodeSelector: {}
tolerations: []
affinity: {}
