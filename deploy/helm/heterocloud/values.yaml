replicaCount: 3
hostNetwork: true

image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

publicOrigin: https://cloud.example.com
additionalOrigins: []
secureCookie: true
sessionTtlSeconds: 43200
databaseMaxConnections: 20

oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  publicCallbackUrl: ""

flowAccess:
  issuer: heterocloud
  audience: heterocloud-flow-data

flowPublicEndpoints:
  - https://flow.example.com
flowInternalEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/

worker:
  replicaCount: 3
  flowEndpoint: http://heterocloud-flow-api.heterocloud-flow.svc.cluster.local:8080/
  flashEndpoint: http://heterocloud-flash-api.heterocloud-flash.svc.cluster.local:8080/
  providerIssuer: heterocloud
  flowAudience: heterocloud-flow
  flashAudience: heterocloud-flash
  providerKeyId: heterocloud-provider-1
  pollMilliseconds: 500
  databaseMaxConnections: 5

secrets:
  runtimeSecretName: heterocloud-runtime
  databaseUrlKey: database-url
  csrfKeyKey: csrf-key
  bootstrapPasswordKey: bootstrap-password
  tlsSecretName: heterocloud-tls
  flowAccessSecretName: heterocloud-flow-access
  flowAccessSecretKey: hmac-secret
  oidcSecretName: heterocloud-oidc
  oidcClientSecretKey: client-secret
  providerSigningSecretName: heterocloud-provider-signing
  providerSigningKeyKey: ed25519-private.pem

bootstrap:
  enabled: false
  email: ""
  displayName: HeteroCloud Administrator
  organizationSlug: heterocloud
  organizationName: HeteroCloud

service:
  # The public HTTP entry point is the GitOps-managed Envoy Gateway. Keeping
  # this Service private removes the direct HeteroNetwork L4 bypass.
  type: ClusterIP
  port: 10443
  loadBalancerClass: ""
  trafficMode: forwarded
  ingressReplicas: 3
  externalTrafficPolicy: Cluster

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  databaseCidrs:
    - 10.250.0.0/24
  databasePort: 25432
  providerCidrs:
    - 10.96.0.0/12
  providerPort: 8080
  oidcCidrs:
    - 0.0.0.0/0
    - ::/0
  oidcPort: 443

nodeSelector: {}
tolerations: []
affinity: {}
