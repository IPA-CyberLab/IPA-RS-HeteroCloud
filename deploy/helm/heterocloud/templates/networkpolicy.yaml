{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heterocloud.fullname" . }}
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heterocloud.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.providerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.providerPort }}
          protocol: TCP
    {{- if .Values.registry.enabled }}
    - to:
        {{- range .Values.networkPolicy.registryCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.registryPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.oidc.enabled }}
    - to:
        {{- range .Values.networkPolicy.oidcCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.oidcPort }}
          protocol: TCP
    {{- end }}
{{- if .Values.ownerConsole.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heterocloud.fullname" . }}-owner-console
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-console
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heterocloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: owner-console
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.ownerConsole.allowedNetworks }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- range .Values.ownerConsole.serviceProxyNetworks }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.ownerConsole.listenPort }}
          protocol: TCP
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heterocloud.fullname" . }}-worker
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heterocloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
    - to:
        {{- range .Values.networkPolicy.providerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.providerPort }}
          protocol: TCP
{{- end }}
