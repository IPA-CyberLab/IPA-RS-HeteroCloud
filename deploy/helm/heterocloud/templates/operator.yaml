{{- if .Values.ownerConsole.enabled }}
{{- if .Values.ownerConsole.databaseProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heterocloud.fullname" . }}-owner-database-proxy
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-console
data:
  haproxy.cfg: |
    global
        log stdout format raw local0
        maxconn 256

    defaults
        log global
        mode tcp
        option tcplog
        timeout connect 3s
        timeout client 1m
        timeout server 1m

    frontend local_postgres
        bind 127.0.0.1:25432
        default_backend cluster_postgres

    backend cluster_postgres
        option tcp-check
        server cluster {{ required "ownerConsole.databaseProxy.endpoint is required" .Values.ownerConsole.databaseProxy.endpoint }} check inter 2s fall 2 rise 1
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heterocloud.fullname" . }}-owner-console
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-console
spec:
  replicas: {{ .Values.ownerConsole.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heterocloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: owner-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "heterocloud.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: owner-console
    spec:
      hostNetwork: {{ .Values.ownerConsole.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.ownerConsole.hostNetwork }}
      serviceAccountName: {{ include "heterocloud.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "heterocloud.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: owner-console
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "heterocloud.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: owner-console
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: owner-console
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:{{ .Values.ownerConsole.listenPort }}
            - --database-url-file=/var/run/secrets/runtime/database-url
            - --csrf-key-file=/var/run/secrets/runtime/csrf-key
            - --flow-access-secret-file=/var/run/secrets/flow-access/hmac-secret
            - --flow-access-issuer={{ .Values.flowAccess.issuer }}
            - --flow-access-audience={{ .Values.flowAccess.audience }}
            - --flow-public-endpoints={{ join "," (required "flowPublicEndpoints is required" .Values.flowPublicEndpoints) }}
            - --flow-internal-endpoint={{ required "flowInternalEndpoint is required" .Values.flowInternalEndpoint }}
            - --flash-internal-endpoint={{ required "flashExec.endpoint is required" .Values.flashExec.endpoint }}
            {{- if .Values.registry.enabled }}
            - --registry-internal-endpoint={{ required "registry.internalEndpoint is required" .Values.registry.internalEndpoint }}
            - --registry-public-endpoint={{ required "registry.publicEndpoint is required" .Values.registry.publicEndpoint }}
            - --registry-admin-username={{ required "registry.adminUsername is required" .Values.registry.adminUsername }}
            - --registry-admin-password-file=/var/run/secrets/registry/admin-password
            {{- end }}
            - --provider-signing-key-file=/var/run/secrets/provider/ed25519-private.pem
            - --provider-issuer={{ .Values.flashExec.providerIssuer }}
            - --flash-audience={{ .Values.flashExec.audience }}
            - --provider-key-id={{ .Values.flashExec.providerKeyId }}
            - --public-origin={{ required "ownerConsole.origin is required" .Values.ownerConsole.origin }}
            - --secure-cookie=false
            - --session-ttl-seconds={{ .Values.sessionTtlSeconds }}
            - --database-max-connections={{ .Values.databaseMaxConnections }}
            - --owner-origin={{ required "ownerConsole.origin is required" .Values.ownerConsole.origin }}
            - --owner-email={{ required "ownerConsole.email is required" .Values.ownerConsole.email }}
            - --owner-console-mode=true
            - --owner-allowed-networks={{ join "," .Values.ownerConsole.allowedNetworks }}
            {{- if .Values.oidc.enabled }}
            - --oidc-issuer-url={{ required "oidc.issuerUrl is required" .Values.oidc.issuerUrl }}
            - --oidc-client-id={{ required "oidc.clientId is required" .Values.oidc.clientId }}
            - --oidc-client-secret-file=/var/run/secrets/oidc/client-secret
            - --oidc-public-callback-url={{ required "ownerConsole.oidcPublicCallbackUrl is required" .Values.ownerConsole.oidcPublicCallbackUrl }}
            {{- end }}
            - --console-dir=/opt/heterocloud/console
          ports:
            - name: http-owner
              containerPort: {{ .Values.ownerConsole.listenPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http-owner
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http-owner
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /var/run/secrets/runtime
              readOnly: true
            - name: flow-access
              mountPath: /var/run/secrets/flow-access
              readOnly: true
            - name: provider
              mountPath: /var/run/secrets/provider
              readOnly: true
            {{- if .Values.registry.enabled }}
            - name: registry
              mountPath: /var/run/secrets/registry
              readOnly: true
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: oidc
              mountPath: /var/run/secrets/oidc
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
        {{- if .Values.ownerConsole.databaseProxy.enabled }}
        - name: database-proxy
          image: {{ required "ownerConsole.databaseProxy.image is required" .Values.ownerConsole.databaseProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          readinessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 25432
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 25432
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: database-proxy
              mountPath: /usr/local/etc/haproxy
              readOnly: true
        {{- end }}
      volumes:
        - name: runtime
          secret:
            secretName: {{ .Values.secrets.runtimeSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.databaseUrlKey }}
                path: database-url
              - key: {{ .Values.secrets.csrfKeyKey }}
                path: csrf-key
        - name: flow-access
          secret:
            secretName: {{ .Values.secrets.flowAccessSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.flowAccessSecretKey }}
                path: hmac-secret
        - name: provider
          secret:
            secretName: {{ .Values.secrets.providerSigningSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.providerSigningKeyKey }}
                path: ed25519-private.pem
        {{- if .Values.registry.enabled }}
        - name: registry
          secret:
            secretName: {{ required "registry.adminSecretName is required" .Values.registry.adminSecretName }}
            defaultMode: 0400
            items:
              - key: {{ required "registry.adminPasswordKey is required" .Values.registry.adminPasswordKey }}
                path: admin-password
        {{- end }}
        {{- if .Values.oidc.enabled }}
        - name: oidc
          secret:
            secretName: {{ .Values.secrets.oidcSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.oidcClientSecretKey }}
                path: client-secret
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.ownerConsole.databaseProxy.enabled }}
        - name: database-proxy
          configMap:
            name: {{ include "heterocloud.fullname" . }}-owner-database-proxy
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "heterocloud.fullname" . }}-owner-console
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-console
spec:
  type: ClusterIP
  {{- with .Values.ownerConsole.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http-owner
      port: {{ .Values.ownerConsole.servicePort }}
      targetPort: http-owner
      protocol: TCP
      appProtocol: http
  selector:
    app.kubernetes.io/name: {{ include "heterocloud.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: owner-console
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heterocloud.fullname" . }}-owner-console
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: owner-console
spec:
  minAvailable: {{ .Values.ownerConsole.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heterocloud.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: owner-console
{{- end }}
