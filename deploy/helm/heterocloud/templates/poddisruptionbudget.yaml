apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heterocloud.fullname" . }}
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "heterocloud.selectorLabels" . | nindent 6 }}

