apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heterocloud.fullname" . }}
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      {{- include "heterocloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heterocloud.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ include "heterocloud.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "heterocloud.selectorLabels" . | nindent 14 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "heterocloud.selectorLabels" . | nindent 18 }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            {{- if .Values.hostNetwork }}
            - --listen=$(HOST_IP):8443
            {{- else }}
            - --listen=0.0.0.0:8443
            {{- end }}
            - --database-url-file=/var/run/secrets/runtime/database-url
            - --csrf-key-file=/var/run/secrets/runtime/csrf-key
            - --flow-access-secret-file=/var/run/secrets/flow-access/hmac-secret
            - --flow-access-issuer={{ .Values.flowAccess.issuer }}
            - --flow-access-audience={{ .Values.flowAccess.audience }}
            - --flow-public-endpoints={{ join "," (required "flowPublicEndpoints is required" .Values.flowPublicEndpoints) }}
            - --flow-internal-endpoint={{ required "flowInternalEndpoint is required" .Values.flowInternalEndpoint }}
            - --flash-internal-endpoint={{ required "flashExec.endpoint is required" .Values.flashExec.endpoint }}
            {{- if .Values.registry.enabled }}
            - --registry-internal-endpoint={{ required "registry.internalEndpoint is required" .Values.registry.internalEndpoint }}
            - --registry-public-endpoint={{ required "registry.publicEndpoint is required" .Values.registry.publicEndpoint }}
            - --registry-admin-username={{ required "registry.adminUsername is required" .Values.registry.adminUsername }}
            - --registry-admin-password-file=/var/run/secrets/registry/admin-password
            {{- end }}
            - --provider-signing-key-file=/var/run/secrets/provider/ed25519-private.pem
            - --provider-issuer={{ .Values.flashExec.providerIssuer }}
            - --flash-audience={{ .Values.flashExec.audience }}
            - --provider-key-id={{ .Values.flashExec.providerKeyId }}
            - --public-origin={{ required "publicOrigin is required" .Values.publicOrigin }}
            {{- if .Values.additionalOrigins }}
            - --additional-origins={{ join "," .Values.additionalOrigins }}
            {{- end }}
            {{- if .Values.trustedProxyNetworks }}
            - --trusted-proxy-networks={{ join "," .Values.trustedProxyNetworks }}
            {{- end }}
            - --secure-cookie={{ .Values.secureCookie }}
            - --session-ttl-seconds={{ .Values.sessionTtlSeconds }}
            - --database-max-connections={{ .Values.databaseMaxConnections }}
            {{- if .Values.oidc.enabled }}
            - --oidc-issuer-url={{ required "oidc.issuerUrl is required" .Values.oidc.issuerUrl }}
            {{- if .Values.oidc.backchannelIssuerUrl }}
            - --oidc-backchannel-issuer-url={{ .Values.oidc.backchannelIssuerUrl }}
            {{- end }}
            - --oidc-client-id={{ required "oidc.clientId is required" .Values.oidc.clientId }}
            - --oidc-client-secret-file=/var/run/secrets/oidc/client-secret
            - --oidc-public-callback-url={{ required "oidc.publicCallbackUrl is required" .Values.oidc.publicCallbackUrl }}
            {{- end }}
            - --console-dir=/opt/heterocloud/console
            - --tls-cert-file=/var/run/secrets/tls/tls.crt
            - --tls-key-file=/var/run/secrets/tls/tls.key
            {{- if .Values.bootstrap.enabled }}
            - --bootstrap-email={{ required "bootstrap.email is required" .Values.bootstrap.email }}
            - --bootstrap-password-file=/var/run/secrets/runtime/bootstrap-password
            - --bootstrap-display-name={{ .Values.bootstrap.displayName }}
            - --bootstrap-organization-slug={{ .Values.bootstrap.organizationSlug }}
            - --bootstrap-organization-name={{ .Values.bootstrap.organizationName }}
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime
              mountPath: /var/run/secrets/runtime
              readOnly: true
            - name: tls
              mountPath: /var/run/secrets/tls
              readOnly: true
            - name: flow-access
              mountPath: /var/run/secrets/flow-access
              readOnly: true
            - name: provider
              mountPath: /var/run/secrets/provider
              readOnly: true
            {{- if .Values.registry.enabled }}
            - name: registry
              mountPath: /var/run/secrets/registry
              readOnly: true
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: oidc
              mountPath: /var/run/secrets/oidc
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          secret:
            secretName: {{ .Values.secrets.runtimeSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.databaseUrlKey }}
                path: database-url
              - key: {{ .Values.secrets.csrfKeyKey }}
                path: csrf-key
              {{- if .Values.bootstrap.enabled }}
              - key: {{ .Values.secrets.bootstrapPasswordKey }}
                path: bootstrap-password
              {{- end }}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tlsSecretName }}
            defaultMode: 0400
        - name: flow-access
          secret:
            secretName: {{ .Values.secrets.flowAccessSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.flowAccessSecretKey }}
                path: hmac-secret
        - name: provider
          secret:
            secretName: {{ .Values.secrets.providerSigningSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.providerSigningKeyKey }}
                path: ed25519-private.pem
        {{- if .Values.registry.enabled }}
        - name: registry
          secret:
            secretName: {{ required "registry.adminSecretName is required" .Values.registry.adminSecretName }}
            defaultMode: 0400
            items:
              - key: {{ required "registry.adminPasswordKey is required" .Values.registry.adminPasswordKey }}
                path: admin-password
        {{- end }}
        {{- if .Values.oidc.enabled }}
        - name: oidc
          secret:
            secretName: {{ .Values.secrets.oidcSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.oidcClientSecretKey }}
                path: client-secret
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
