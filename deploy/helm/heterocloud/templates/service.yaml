apiVersion: v1
kind: Service
metadata:
  name: {{ include "heterocloud.fullname" . }}
  labels:
    {{- include "heterocloud.labels" . | nindent 4 }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  annotations:
    networking.heteronetwork.io/traffic-mode: {{ .Values.service.trafficMode | quote }}
    networking.heteronetwork.io/ingress-replicas: {{ .Values.service.ingressReplicas | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  loadBalancerClass: {{ .Values.service.loadBalancerClass }}
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "heterocloud.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      appProtocol: https
